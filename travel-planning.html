<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelry - Plan Your Trip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/beanco-script" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            background-attachment: fixed;
        }
        .logo {
            font-family: 'Beanco Script', cursive;
        }
        .form-container {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.9);
        }
        #airplane-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .main-content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-md fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-3xl font-bold text-blue-500 logo">Travelry</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 3D Airplane -->
    <div id="airplane-container"></div>

    <!-- Main Content -->
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 main-content">
        <div class="max-w-2xl w-full space-y-8 form-container p-12 rounded-lg shadow-2xl">
            <div class="text-center">
                <h2 class="text-4xl font-extrabold text-gray-900 mb-4">
                    Plan Your Perfect Trip
                </h2>
                <p class="text-lg text-gray-600">
                    Let's create your dream vacation together
                </p>
            </div>

            <form class="mt-12 space-y-8" action="#" method="POST">
                <!-- Full Name -->
                <div>
                    <label for="full-name" class="block text-lg font-medium text-gray-700 mb-2">Full Name</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="user" class="h-6 w-6 text-gray-400"></i>
                        </div>
                        <input id="full-name" name="full-name" type="text" required 
                            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md"
                            placeholder="Enter your full name">
                    </div>
                </div>

                <!-- Age -->
                <div>
                    <label for="age" class="block text-lg font-medium text-gray-700 mb-2">Age</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="user" class="h-6 w-6 text-gray-400"></i>
                        </div>
                        <input id="age" name="age" type="number" min="1" max="100" required 
                            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md"
                            placeholder="Enter your age">
                    </div>
                </div>

                <!-- Number of Members -->
                <div>
                    <label for="members" class="block text-lg font-medium text-gray-700 mb-2">Number of Travelers</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="users" class="h-6 w-6 text-gray-400"></i>
                        </div>
                        <input id="members" name="members" type="number" min="1" required 
                            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md"
                            placeholder="Number of people traveling">
                    </div>
                </div>

                <!-- Number of Infants -->
                <div>
                    <label for="infants" class="block text-lg font-medium text-gray-700 mb-2">Number of Infants (under 2 years)</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="baby" class="h-6 w-6 text-gray-400"></i>
                        </div>
                        <input id="infants" name="infants" type="number" min="0" required 
                            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md"
                            placeholder="Number of infants traveling">
                    </div>
                </div>

                <!-- Travel Dates -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="from-date" class="block text-lg font-medium text-gray-700 mb-2">From Date</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="calendar" class="h-6 w-6 text-gray-400"></i>
                            </div>
                            <input id="from-date" name="from-date" type="date" required 
                                class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md">
                        </div>
                    </div>
                    <div>
                        <label for="to-date" class="block text-lg font-medium text-gray-700 mb-2">To Date</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="calendar" class="h-6 w-6 text-gray-400"></i>
                            </div>
                            <input id="to-date" name="to-date" type="date" required 
                                class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md">
                        </div>
                    </div>
                </div>

                <!-- Current Location -->
                <div>
                    <label for="current-location" class="block text-lg font-medium text-gray-700 mb-2">Current Location</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="map-pin" class="h-6 w-6 text-gray-400"></i>
                        </div>
                        <input id="current-location" name="current-location" type="text" required 
                            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md"
                            placeholder="Where are you traveling from?">
                    </div>
                </div>

                <!-- Destination -->
                <div>
                    <label for="destination" class="block text-lg font-medium text-gray-700 mb-2">Destination</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="map" class="h-6 w-6 text-gray-400"></i>
                        </div>
                        <input id="destination" name="destination" type="text" required 
                            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-12 py-3 text-lg border-gray-300 rounded-md"
                            placeholder="Where do you want to go?">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mt-12">
                    <button type="submit" onclick="handleSubmit(event)"
                        class="group relative w-full flex justify-center py-4 px-6 border border-transparent text-xl font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                        Plan My Trip
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize Three.js scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('airplane-container').appendChild(renderer.domElement);

        // Add lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 1, 0);
        scene.add(directionalLight);

        // Create a simple airplane model
        const createAirplane = () => {
            const group = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1, 8);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x00C6FB });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.rotation.z = Math.PI / 2;
            group.add(body);

            // Wings
            const wingGeometry = new THREE.BoxGeometry(1, 0.05, 0.2);
            const wingMaterial = new THREE.MeshPhongMaterial({ color: 0x005BEA });
            const wing = new THREE.Mesh(wingGeometry, wingMaterial);
            wing.position.set(0, 0, 0);
            group.add(wing);

            // Tail
            const tailGeometry = new THREE.BoxGeometry(0.2, 0.1, 0.1);
            const tailMaterial = new THREE.MeshPhongMaterial({ color: 0x005BEA });
            const tail = new THREE.Mesh(tailGeometry, tailMaterial);
            tail.position.set(-0.5, 0.1, 0);
            group.add(tail);

            return group;
        };

        const airplane = createAirplane();
        scene.add(airplane);

        // Position camera
        camera.position.z = 2;

        // Animation
        const animate = () => {
            requestAnimationFrame(animate);

            // Rotate airplane
            airplane.rotation.y += 0.01;
            airplane.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;

            // Move airplane in a circular path
            const time = Date.now() * 0.001;
            airplane.position.x = Math.sin(time) * 0.5;
            airplane.position.y = Math.cos(time) * 0.5;
            airplane.position.z = Math.sin(time * 0.5) * 0.2;

            renderer.render(scene, camera);
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        lucide.createIcons();

        function handleSubmit(event) {
            event.preventDefault();
            const destination = document.getElementById('destination').value;
            // Store the destination in localStorage to use on the agents page
            localStorage.setItem('userDestination', destination);
            // Redirect to the travel agents page
            window.location.href = 'travel-agents.html';
        }
    </script>
</body>
</html>
